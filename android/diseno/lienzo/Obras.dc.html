<script type="text/x-dc" data-dc-script data-props='{"foto":{"editor":"text","default":""},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { q: '', foco: false }; }
  renderVals() {
    const foto = (this.props.foto ?? '').trim();
    const todas = [
      { nombre: 'Multifamiliar Flores', detalle: 'Almacenero · última vez hoy', celular: 'Este celular está autorizado aquí', colorCel: '#166534', fondoIcono: '#FFEDD5', colorIcono: '#C2410C' },
      { nombre: '[Otra obra asignada]', detalle: 'Ingeniero SSOMA', celular: 'Celular por autorizar en esta obra', colorCel: '#92400E', fondoIcono: '#F3F4F6', colorIcono: '#4B5563' }
    ];
    const q = this.state.q.trim().toLowerCase();
    const obras = q ? todas.filter((o) => o.nombre.toLowerCase().includes(q)) : todas;
    return {
      foto, conFoto: foto !== '', sinFoto: foto === '',
      q: this.state.q,
      buscar: (e) => this.setState({ q: e.target.value }),
      enfocar: () => this.setState({ foco: true }),
      desenfocar: () => this.setState({ foco: false }),
      bordeBuscar: this.state.foco ? '#C2410C' : 'transparent',
      obras, vacio: obras.length === 0
    };
  }
}
</script>
