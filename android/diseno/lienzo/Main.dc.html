<script type="text/x-dc" data-dc-script data-props='{"foto":{"editor":"text","default":""},"conError":{"editor":"boolean","default":false},"lento":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    // login → preparando (capa visible, plano en blanco) → dibujando (se trazan las líneas)
    //       → logo (aparece el logo; en la app: hasta que responde el servidor) → abriendo → listo
    this.state = { fase: 'login' };
    this.timers = [];
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  entrar() {
    if (this.state.fase !== 'login') return;
    const k = (this.props.lento ?? false) ? 3 : 1;
    const ir = (fase, ms) => this.timers.push(setTimeout(() => this.setState({ fase }), ms * k));
    this.setState({ fase: 'preparando' });
    ir('dibujando', 60);
    ir('logo', 2300);
    ir('abriendo', 3500);
    ir('listo', 4100);
  }
  renderVals() {
    const foto = (this.props.foto ?? '').trim();
    const f = this.state.fase;
    const k = (this.props.lento ?? false) ? 3 : 1;
    const capa = f === 'preparando' || f === 'dibujando' || f === 'logo' || f === 'abriendo';
    const dibujando = f === 'dibujando' || f === 'logo' || f === 'abriendo';
    return {
      foto, conFoto: foto !== '', sinFoto: foto === '',
      conError: this.props.conError ?? false,
      entrar: () => this.entrar(),
      verLogin: f === 'login' || f === 'preparando',
      verDestino: f === 'logo' || f === 'abriendo' || f === 'listo',
      capaOculta: capa ? 'false' : 'true',
      capaOpacidad: capa && f !== 'abriendo' ? '1' : '0',
      capaEscala: f === 'abriendo' ? 'scale(1.06)' : 'scale(1)',
      capaEventos: capa ? 'auto' : 'none',
      durCapa: (f === 'abriendo' ? 600 : 250) * k + 'ms',
      trazo: dibujando ? '0' : '1',
      durTrazo: (dibujando ? 900 : 0) * k + 'ms',
      retraso0: (dibujando ? 0 * k : 0) + 'ms',
      retraso1: (dibujando ? 150 * k : 0) + 'ms',
      retraso2: (dibujando ? 420 * k : 0) + 'ms',
      retraso3: (dibujando ? 700 * k : 0) + 'ms',
      retraso4: (dibujando ? 820 * k : 0) + 'ms',
      retraso5: (dibujando ? 1050 * k : 0) + 'ms',
      retraso6: (dibujando ? 1150 * k : 0) + 'ms',
      retraso7: (dibujando ? 1350 * k : 0) + 'ms',
      cotaOpacidad: f === 'logo' || f === 'abriendo' ? '1' : '0',
      logoOpacidad: f === 'logo' || f === 'abriendo' ? '1' : '0',
      logoEscala: f === 'logo' || f === 'abriendo' ? 'translateY(0) scale(1)' : 'translateY(12px) scale(0.94)',
      textoCarga: 'Preparando tu obra…'
    };
  }
}
</script>
