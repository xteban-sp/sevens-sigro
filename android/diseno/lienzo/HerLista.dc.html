<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Herramientas de la obra</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
.vidrio{background:rgba(255,255,255,0.58);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,0.75);box-shadow:0 8px 28px rgba(15,23,42,0.10)}
.vidrio-fuerte{background:rgba(255,255,255,0.78);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,0.85)}
.campo{box-sizing:border-box;height:52px;border-radius:16px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.74);padding:0 16px;font:16px Inter,sans-serif;color:#111827;width:100%}
.campo:focus{outline:2px solid #C2410C;outline-offset:1px}
.campo::placeholder{color:#6B7280}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #111827; position: relative; overflow: hidden; background: #EDF1F6">
<svg aria-hidden="true" width="390" height="900" viewBox="0 0 390 900" style="position: absolute; left: 0; top: 0">
<defs>
<linearGradient id="hl-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDF1F6"></stop><stop offset="0.55" stop-color="#F1F1EF"></stop><stop offset="1" stop-color="#F5EAE0"></stop></linearGradient>
<pattern id="hl-c" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-width="0.5" opacity="0.4"></path></pattern>
<pattern id="hl-C" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#64748B" stroke-width="0.8" opacity="0.3"></path></pattern>
<radialGradient id="hl-mn" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FB923C" stop-opacity="0.5"></stop><stop offset="1" stop-color="#FB923C" stop-opacity="0"></stop></radialGradient>
<radialGradient id="hl-ma" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#60A5FA" stop-opacity="0.4"></stop><stop offset="1" stop-color="#60A5FA" stop-opacity="0"></stop></radialGradient>
<radialGradient id="hl-mt" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.32"></stop><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"></stop></radialGradient>
</defs>
<rect width="390" height="900" fill="url(#hl-f)"></rect>
<rect width="390" height="900" fill="url(#hl-c)"></rect>
<rect width="390" height="900" fill="url(#hl-C)"></rect>
<circle cx="320" cy="140" r="200" fill="url(#hl-mn)"></circle><circle cx="60" cy="520" r="200" fill="url(#hl-ma)"></circle><circle cx="330" cy="820" r="160" fill="url(#hl-mt)"></circle>
<g fill="none" stroke="#475569" stroke-width="1.4" opacity="0.5">
<path d="M240 520v330M310 520v330M380 520v330M240 520h140M240 630h140M240 740h140M240 850h140"></path>
<path d="M240 520l70 110M310 520l70 110M240 630l70 110M310 630l70 110M240 740l70 110M310 740l70 110" stroke-width="1"></path>
<path d="M226 850h168" stroke-width="2"></path></g>
<g fill="none" stroke="#C2410C" stroke-width="1.1" opacity="0.6"><path d="M220 520v330M214 520h12M214 850h12"></path></g>
<text x="190" y="690" font-family="Inter, sans-serif" font-size="10" fill="#C2410C" opacity="0.8" transform="rotate(-90 196 690)">3 cuerpos · 1.10 m</text>
</svg>
<header style="position: relative; padding: 44px 16px 8px 12px; display: flex; align-items: center; gap: 4px">
<a href="Inicio.dc.html" aria-label="Volver" class="vidrio" style="width: 44px; height: 44px; border-radius: 22px; margin-right: 8px; display: flex; align-items: center; justify-content: center; flex: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em">Herramientas</h1>
<p style="margin: 0; font-size: 14px; color: #4B5563">Multifamiliar Flores · quién tiene cada una</p>
</div>
</header>
<div style="position: relative; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 12px">
<a href="HerMantBaja.dc.html" class="vidrio-fuerte" style="border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #92400E; border: 1px solid #FCD34D">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2.2" stroke-linecap="round" style="flex: none"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg>
<span style="flex: 1; font-size: 14px; font-weight: 700">1 con mantenimiento vencido: Mezcladora H-003</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{filtros}}" as="f" hint-placeholder-count="5">
<button onClick="{{f.elegir}}" aria-pressed="{{f.on}}" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: {{f.bg}}; color: {{f.fg}}; font: 700 13px Inter, sans-serif; cursor: pointer">{{f.texto}}</button>
</sc-for>
</div>
<div class="vidrio" style="border-radius: 26px; display: flex; flex-direction: column; overflow: hidden">
<sc-for list="{{visibles}}" as="t" hint-placeholder-count="5">
<a href="HerFicha.dc.html" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(17,24,39,0.07); text-decoration: none; color: #111827; opacity: {{t.opacidad}}">
<span style="width: 42px; height: 42px; border-radius: 14px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center; flex: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">{{t.nombre}}</span>
<span style="font-size: 13px; color: #4B5563">{{t.id}} · {{t.detalle}}</span>
<sc-if value="{{t.hayAviso}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 700; color: #B45309">{{t.aviso}}</span></sc-if>
</span>
<span style="background: {{t.bg}}; color: {{t.fg}}; border-radius: 999px; padding: 4px 9px; font-size: 11px; font-weight: 700; flex: none">{{t.estadoTxt}}</span>
</a>
</sc-for>
</div>
</div>
<a href="HerIngreso.dc.html" style="position: absolute; right: 18px; bottom: 28px; height: 58px; padding: 0 22px 0 18px; border-radius: 29px; background: #111827; color: #FFFFFF; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 0 12px 28px rgba(17,24,39,0.32)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FB923C" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Ingresar herramienta</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
const HER = [{"id": "H-001", "nombre": "Amoladora angular 4 1/2\"", "estado": "en_uso", "detalle": "Trabajador 03 · desde ayer", "aviso": ""}, {"id": "H-002", "nombre": "Rotomartillo SDS Plus", "estado": "disponible", "detalle": "En almacén · estado bueno", "aviso": ""}, {"id": "H-003", "nombre": "Mezcladora de concreto 9 p³", "estado": "mantenimiento", "detalle": "Correctivo · desde el lunes", "aviso": "Mantenimiento vencido"}, {"id": "H-004", "nombre": "Vibradora de concreto", "estado": "en_uso", "detalle": "Trabajador 05 · desde hoy", "aviso": ""}, {"id": "H-005", "nombre": "Cortadora de fierro", "estado": "disponible", "detalle": "En almacén · estado regular", "aviso": ""}, {"id": "H-006", "nombre": "Nivel láser", "estado": "disponible", "detalle": "En almacén · estado nuevo", "aviso": ""}, {"id": "H-007", "nombre": "Carretilla buggy", "estado": "baja", "detalle": "Robo · último: Trabajador 04", "aviso": ""}];
const EST = {"disponible": ["#DCFCE7", "#166534", "Disponible"], "en_uso": ["#DBEAFE", "#1E40AF", "En uso"], "mantenimiento": ["#FEF3C7", "#92400E", "En mantenimiento"], "baja": ["#E5E7EB", "#374151", "Dada de baja"]};
const FILTROS = [['todas', 'Todas'], ['disponible', 'Disponibles'], ['en_uso', 'En uso'], ['mantenimiento', 'Mantenimiento'], ['baja', 'De baja']];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'todas' }; }
  renderVals() {
    const f = this.state.f;
    return {
      filtros: FILTROS.map(([k, t]) => {
        const n = k === 'todas' ? HER.length : HER.filter((x) => x.estado === k).length;
        return { texto: t + ' · ' + n, on: f === k, elegir: () => this.setState({ f: k }),
                 bg: f === k ? '#111827' : 'rgba(255,255,255,0.82)', fg: f === k ? '#FFFFFF' : '#111827' };
      }),
      visibles: HER.filter((x) => f === 'todas' || x.estado === f).map((x) => ({ ...x,
        bg: EST[x.estado][0], fg: EST[x.estado][1], estadoTxt: EST[x.estado][2], hayAviso: !!x.aviso,
        opacidad: x.estado === 'baja' ? 0.7 : 1 }))
    };
  }
}
</script>
</body>
</html>
