<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Stock del almacén</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
input:focus{outline:2px solid #C2410C;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #F4F4F6; font-family: Inter, system-ui, sans-serif; color: #111827">
  <header style="padding: 48px 20px 8px">
    <a href="Inicio.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(17,24,39,0.08); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
  </header>
  <div style="padding: 4px 20px 40px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Stock</h1>
      <p style="margin: 0; font-size: 14px; color: #4B5563">Calculado por el servidor · último movimiento 28/10 16:35</p>
    </div>

    <div role="tablist" aria-label="Almacén" style="background: #E5E7EB; border-radius: 14px; padding: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{vistas}}" as="v" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{v.activo}}" onClick="{{v.elegir}}" style="min-height: 40px; border: 0; border-radius: 10px; background: {{v.fondo}}; box-shadow: {{v.sombra}}; font: 600 14px Inter, sans-serif; color: #111827; cursor: pointer">{{v.nombre}}</button>
      </sc-for>
    </div>

    <label style="display: flex; align-items: center; height: 48px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(17,24,39,0.06); padding: 0 14px; gap: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input placeholder="Buscar insumo" aria-label="Buscar insumo" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 16px Inter, sans-serif">
    </label>

    <div style="display: flex; align-items: center; gap: 8px; background: #FEF3C7; color: #78350F; border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 600">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17.5v.5"></path></svg>
      2 insumos por debajo del punto de reposición
    </div>

    <section style="background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 3px rgba(17,24,39,0.06); display: flex; flex-direction: column">
      <sc-for list="{{filas}}" as="f" hint-placeholder-count="5">
        <div style="padding: 14px 16px; border-bottom: 1px solid #F3F4F6; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: baseline; gap: 10px">
            <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600">{{f.nombre}}</span>
            <span style="font-size: 17px; font-weight: 800">{{f.saldo}}</span>
            <span style="font-size: 13px; color: #4B5563; width: 34px">{{f.unidad}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="flex: 1; height: 6px; border-radius: 3px; background: #F3F4F6; display: flex; overflow: hidden"><span style="width: {{f.ancho}}; height: 6px; background: {{f.color}}"></span></span>
            <sc-if value="{{f.bajo}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 700; color: #92400E; background: #FEF3C7; border-radius: 999px; padding: 3px 8px">Reponer</span></sc-if>
            <sc-if value="{{f.ok}}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; color: #4B5563">reponer en {{f.punto}}</span></sc-if>
          </div>
        </div>
      </sc-for>
    </section>
    <p style="margin: 0; font-size: 13px; color: #4B5563; line-height: 1.45">Sin señal se muestra el último saldo recibido con su hora. La app nunca lo calcula por su cuenta.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { vista: 'almacen' }; }
  renderVals() {
    const v = this.state.vista;
    const datos = [
      ['Cemento Portland tipo I', 38, 'bls', 60, 300], ['Arena gruesa', 4.5, 'm³', 3, 20],
      ['Fierro corrugado 1/2"', 12, 'und', 40, 200], ['Clavo 1 1/2" estriado', 15, 'kg', 5, 40],
      ['Piedra chancada 1/2"', 9, 'm³', 4, 25]
    ];
    const k = v === 'obra' ? 1.4 : 1;
    return {
      vistas: [['almacen', 'Almacén principal'], ['obra', 'Toda la obra']].map(([id, nombre]) => ({
        nombre, activo: v === id ? 'true' : 'false', fondo: v === id ? '#FFFFFF' : 'transparent',
        sombra: v === id ? '0 1px 2px rgba(17,24,39,0.12)' : 'none', elegir: () => this.setState({ vista: id })
      })),
      filas: datos.map(([nombre, s, unidad, punto, max]) => {
        const saldo = Math.round(s * k * 10) / 10;
        const bajo = saldo < punto;
        return { nombre, saldo: String(saldo), unidad, punto: punto + ' ' + unidad, bajo, ok: !bajo,
          ancho: Math.min(100, Math.round(saldo / max * 100)) + '%', color: bajo ? '#D97706' : '#111827' };
      })
    };
  }
}
</script>
</body>
</html>
