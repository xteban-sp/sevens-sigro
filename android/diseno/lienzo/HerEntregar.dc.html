<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entregar herramienta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
.vidrio{background:rgba(255,255,255,0.58);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,0.75);box-shadow:0 8px 28px rgba(15,23,42,0.10)}
.vidrio-fuerte{background:rgba(255,255,255,0.78);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,0.85)}
.campo{box-sizing:border-box;height:52px;border-radius:16px;border:1px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.74);padding:0 16px;font:16px Inter,sans-serif;color:#111827;width:100%}
.campo:focus{outline:2px solid #C2410C;outline-offset:1px}
.campo::placeholder{color:#6B7280}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #111827; position: relative; overflow: hidden; background: #EDF1F6">
<svg aria-hidden="true" width="390" height="900" viewBox="0 0 390 900" style="position: absolute; left: 0; top: 0">
<defs>
<linearGradient id="he-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDF1F7"></stop><stop offset="0.55" stop-color="#F2F1EE"></stop><stop offset="1" stop-color="#F5E9DF"></stop></linearGradient>
<pattern id="he-c" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-width="0.5" opacity="0.4"></path></pattern>
<pattern id="he-C" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#64748B" stroke-width="0.8" opacity="0.3"></path></pattern>
<radialGradient id="he-mn" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FB923C" stop-opacity="0.5"></stop><stop offset="1" stop-color="#FB923C" stop-opacity="0"></stop></radialGradient>
<radialGradient id="he-ma" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#60A5FA" stop-opacity="0.4"></stop><stop offset="1" stop-color="#60A5FA" stop-opacity="0"></stop></radialGradient>
<radialGradient id="he-mt" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.32"></stop><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"></stop></radialGradient>
</defs>
<rect width="390" height="900" fill="url(#he-f)"></rect>
<rect width="390" height="900" fill="url(#he-c)"></rect>
<rect width="390" height="900" fill="url(#he-C)"></rect>
<circle cx="320" cy="160" r="200" fill="url(#he-ma)"></circle><circle cx="50" cy="520" r="200" fill="url(#he-mn)"></circle><circle cx="330" cy="820" r="160" fill="url(#he-mt)"></circle>
<g fill="none" stroke="#475569" stroke-width="1.4" opacity="0.5" stroke-linejoin="round" stroke-linecap="round">
<path d="M220 700h110l30-50H200z"></path><path d="M330 700l50-90h20"></path><circle cx="250" cy="730" r="22"></circle><circle cx="250" cy="730" r="6"></circle>
<path d="M300 700l-10 50h-20"></path></g>
<g fill="none" stroke="#C2410C" stroke-width="1.2" opacity="0.55" stroke-linecap="round"><path d="M40 170h120M140 150l20 20-20 20"></path></g>
<text x="40" y="200" font-family="Inter, sans-serif" font-size="10" fill="#C2410C" opacity="0.75">ENTREGA</text>
</svg>
<header style="position: relative; padding: 44px 16px 8px 12px; display: flex; align-items: center; gap: 4px">
<a href="HerFicha.dc.html" aria-label="Volver" class="vidrio" style="width: 44px; height: 44px; border-radius: 22px; margin-right: 8px; display: flex; align-items: center; justify-content: center; flex: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em">Entregar</h1>
<p style="margin: 0; font-size: 14px; color: #4B5563">Queda a nombre de quien la recibe</p>
</div>
</header>
<div style="position: relative; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 14px">
<div class="vidrio" style="border-radius: 24px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; border-radius: 16px; background: #FFEDD5; display: flex; align-items: center; justify-content: center; flex: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 800">Rotomartillo SDS Plus</span>
<span style="font-size: 13px; color: #4B5563">H-002 · estado bueno</span></span>
<span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700">Disponible</span>
</div>
<div class="vidrio" style="border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; font-weight: 700; color: #374151">¿Quién la recibe? *</span>
<label style="height: 50px; border-radius: 25px; background: rgba(255,255,255,0.85); padding: 0 16px; display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input value="{{q}}" onChange="{{buscar}}" placeholder="Buscar trabajador" aria-label="Buscar trabajador" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 16px Inter, sans-serif; color: #111827; outline: none"></label>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{personas}}" as="p" hint-placeholder-count="4">
<button onClick="{{p.elegir}}" aria-pressed="{{p.on}}" style="min-height: 56px; border-radius: 18px; border: 2px solid {{p.borde}}; background: rgba(255,255,255,0.85); padding: 0 12px; display: flex; align-items: center; gap: 12px; font: 15px Inter, sans-serif; color: #111827; text-align: left; cursor: pointer">
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{p.borde}}; display: flex; align-items: center; justify-content: center; flex: none"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{p.punto}}"></span></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">{{p.n}}</span><span style="font-size: 13px; color: #4B5563">{{p.cat}} · Cuadrilla {{p.cu}}</span></span>
</button>
</sc-for>
</div>
<span style="font-size: 12px; color: #4B5563">Solo aparecen los trabajadores activos de esta obra (Mano de obra).</span>
</div>
<label class="vidrio" style="border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #374151">Fecha de entrega *<input class="campo" type="date" value="{{fecha}}" onChange="{{eFecha}}"></label>
<button disabled="{{bloqueado}}" style="{{estiloBoton}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FB923C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{textoBoton}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
const TRAB = [{"n": "Trabajador 01", "cat": "Operario", "cu": "A"}, {"n": "Trabajador 02", "cat": "Oficial", "cu": "A"}, {"n": "Trabajador 03", "cat": "Oficial", "cu": "A"}, {"n": "Trabajador 04", "cat": "Peón", "cu": "B"}, {"n": "Trabajador 05", "cat": "Operario", "cu": "B"}, {"n": "Trabajador 06", "cat": "Peón", "cu": "B"}];
const BOTON = "height: 58px; border: 0; border-radius: 29px; background: #111827; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 17px Inter, sans-serif; text-decoration: none; cursor: pointer";
const BOTON_OFF = "height: 58px; border: 0; border-radius: 29px; background: #9CA3AF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 17px Inter, sans-serif; text-decoration: none; cursor: not-allowed";
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { q: '', sel: -1, fecha: new Date().toISOString().slice(0, 10) }; }
  renderVals() {
    const st = this.state;
    const q = st.q.toLowerCase().trim();
    const bloqueado = st.sel < 0 || !st.fecha;
    return {
      q: st.q, buscar: (e) => this.setState({ q: e.target.value }),
      personas: TRAB.map((t, i) => ({ ...t, i })).filter((t) => !q || (t.n + ' ' + t.cat).toLowerCase().includes(q)).map((t) => ({ ...t,
        on: st.sel === t.i, elegir: () => this.setState({ sel: t.i }),
        borde: st.sel === t.i ? '#C2410C' : 'rgba(17,24,39,0.12)', punto: st.sel === t.i ? '#C2410C' : 'transparent' })),
      fecha: st.fecha, eFecha: (e) => this.setState({ fecha: e.target.value }),
      bloqueado, estiloBoton: bloqueado ? BOTON_OFF : BOTON,
      textoBoton: st.sel < 0 ? 'Elige quién la recibe' : 'Entregar a ' + TRAB[st.sel].n
    };
  }
}
</script>
</body>
</html>
