<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Traslado entre obras</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
input:focus{outline:2px solid #C2410C;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #F4F4F6; font-family: Inter, system-ui, sans-serif; color: #111827; position: relative">
  <header style="padding: 48px 20px 8px">
    <a href="Inicio.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(17,24,39,0.08); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
  </header>
  <div style="padding: 4px 20px 120px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Traslado</h1>

    <section style="background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 3px rgba(17,24,39,0.06); padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #F3F4F6; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"><path d="M4 21V5l8-3v19M12 9h8v12M2 21h20"></path></svg></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #4B5563; font-weight: 600">Desde</span><span style="font-size: 16px; font-weight: 700">Multifamiliar Flores · principal</span></span>
      </div>
      <span style="margin-left: 19px; width: 2px; height: 18px; background: #D1D5DB"></span>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #FFEDD5; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"><path d="M4 21V5l8-3v19M12 9h8v12M2 21h20"></path></svg></span>
        <label style="flex: 1; display: flex; flex-direction: column; font-size: 12px; color: #4B5563; font-weight: 600">Hacia
          <select style="height: 44px; border: 1px solid #D1D5DB; border-radius: 12px; background: #F9FAFB; padding: 0 10px; font: 600 15px Inter, sans-serif; color: #111827; margin-top: 4px">
            <option>[Otra obra registrada en SIGRO]</option>
            <option>Almacén central</option>
          </select>
        </label>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 3px rgba(17,24,39,0.06); display: flex; flex-direction: column">
      <h2 style="margin: 0; padding: 14px 16px 6px; font-size: 16px; font-weight: 700">Material que sale</h2>
      <sc-for list="{{filas}}" as="f" hint-placeholder-count="2">
        <div style="padding: 12px 16px; border-top: 1px solid #F3F4F6; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600">{{f.nombre}}</span>
            <span style="font-size: 13px; color: {{f.colorDisp}}">Disponible {{f.disp}} {{f.u}}</span>
          </span>
          <input value="{{f.cant}}" onChange="{{f.cambiar}}" inputmode="decimal" aria-label="Cantidad a trasladar" style="width: 72px; height: 44px; box-sizing: border-box; border: 1.5px solid {{f.borde}}; border-radius: 12px; text-align: right; padding: 0 10px; font: 700 16px Inter, sans-serif; color: #111827; background: #F9FAFB">
        </div>
      </sc-for>
      <button style="margin: 4px 16px 14px; min-height: 44px; border: 1.5px dashed #D1D5DB; border-radius: 14px; background: #FFFFFF; font: 600 14px Inter, sans-serif; color: #111827; cursor: pointer">+ Agregar insumo</button>
    </section>

    <div style="background: #EFF6FF; color: #1E3A8A; border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.45">Se registra una <b>salida aquí</b> y un <b>ingreso en la obra destino</b> con el mismo código de traslado. El costo unitario viaja con el material.</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 28px; background: rgba(244,244,246,0.96); border-top: 1px solid #E5E7EB; display: flex; flex-direction: column; gap: 8px">
    <sc-if value="{{excede}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #B91C1C; font-weight: 600; text-align: center">No puedes trasladar más de lo disponible</span></sc-if>
    <button disabled="{{excede}}" style="height: 58px; border: 0; border-radius: 29px; background: {{fondoBoton}}; color: #FFFFFF; font: 700 16px Inter, sans-serif; cursor: pointer">Registrar traslado</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cant: { a: '20', b: '1' } }; }
  renderVals() {
    const base = [['a', 'Cemento Portland tipo I', 38, 'bls'], ['b', 'Arena gruesa', 4.5, 'm³']];
    let excede = false;
    const filas = base.map(([id, nombre, disp, u]) => {
      const v = parseFloat(String(this.state.cant[id]).replace(',', '.'));
      const mal = !isNaN(v) && v > disp;
      if (mal) excede = true;
      return { nombre, disp, u, cant: this.state.cant[id], borde: mal ? '#B91C1C' : '#D1D5DB', colorDisp: mal ? '#B91C1C' : '#4B5563',
        cambiar: (e) => this.setState({ cant: { ...this.state.cant, [id]: e.target.value } }) };
    });
    return { filas, excede, fondoBoton: excede ? '#9CA3AF' : '#111827' };
  }
}
</script>
</body>
</html>
