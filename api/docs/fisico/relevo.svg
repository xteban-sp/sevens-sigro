<text text-anchor="start" x="19.5" y="-493.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00" fill="#b00020">PK / FK</text>
<text text-anchor="start" x="63.5" y="-493.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;clave primaria / foránea (la flecha va del hijo al padre) · </text>
<text text-anchor="start" x="383.5" y="-493.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00" fill="#e46c0a">FK*</text>
<text text-anchor="start" x="405.5" y="-493.2" font-family="Helvetica,sans-Serif" font-size="11.00"> apunta a otro servicio · </text>
<text text-anchor="start" x="542.5" y="-493.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">?</text>
<text text-anchor="start" x="549.5" y="-493.2" font-family="Helvetica,sans-Serif" font-size="11.00"> admite NULL</text>
<text text-anchor="start" x="19.5" y="-475.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00" fill="#2f5597">Flecha azul gruesa</text>
<text text-anchor="start" x="135.5" y="-475.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;FK compuesta (id, proyecto_id): el motor garantiza que ambos son de la misma obra</text>
<text text-anchor="start" x="19.5" y="-457.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00" fill="#c00000">FK roja discontinua</text>
<text text-anchor="start" x="138.5" y="-457.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;cruza de un servicio a otro. En todo el sistema hay </text>
<text text-anchor="start" x="432.5" y="-457.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">24</text>
<text text-anchor="start" x="448.5" y="-457.2" font-family="Helvetica,sans-Serif" font-size="11.00">; 12 son de autoría hacia obra.usuario.</text>
<text text-anchor="start" x="19.5" y="-438.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;&#160;Fase 1 (hoy): se conservan para no perder integridad; el servicio NO puede leer la tabla ajena (sin permiso), solo la referencia.</text>
<text text-anchor="start" x="19.5" y="-420.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;&#160;Fase 2 (Sprint 2): se reemplazan por una réplica local alimentada por eventos y la FK se elimina (ADR&#45;09).</text>
<text text-anchor="start" x="19.5" y="-403.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00" fill="#7f6000">UNIQUE</text>
<text text-anchor="start" x="67.5" y="-403.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;índice único que sostiene una regla del dominio (parcial si trae WHERE)</text>
<text text-anchor="start" x="19.5" y="-385.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">permisos</text>
<text text-anchor="start" x="76.5" y="-385.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;lo que el rol de cada servicio puede hacer en la tabla: S select · I insert · U update · D delete. Ningún servicio tiene D.</text>
<text text-anchor="start" x="19.5" y="-367.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Vistas:</text>
<text text-anchor="start" x="62.5" y="-367.2" font-family="Helvetica,sans-Serif" font-size="11.00"> compras.parametro_reposicion_vigente, compras.saldo_por_comprar, compras.solicitud_estado, compras.solicitud_linea_avance, tareo.horas_acumuladas, tareo.jornada_vigente</text>
<text text-anchor="start" x="19.5" y="-349.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">SECURITY DEFINER</text>
<text text-anchor="start" x="137.5" y="-349.2" font-family="Helvetica,sans-Serif" font-size="11.00"> (únicas que escriben periodos, plazo y correlativos, o validan contra otro esquema): compras.tg_compra_validar(), compras.tg_solicitud_numero(), obra.ampliar_plazo(), obra.generar_periodos(), tareo.tg_jornada_validar(), tareo.tg_trabajador_validar()</text>
<text text-anchor="start" x="19.5" y="-331.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Despliegue:</text>
<text text-anchor="start" x="92.5" y="-331.2" font-family="Helvetica,sans-Serif" font-size="11.00"> una sola instancia PostgreSQL, un esquema y un usuario por servicio; ningún servicio puede leer el esquema de otro.</text>
